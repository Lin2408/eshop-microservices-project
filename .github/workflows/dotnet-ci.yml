name: .NET CI

'on':
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore Web Solution
        run: dotnet restore eShop.Web.slnf

      - name: Build Web Solution
        run: dotnet build eShop.Web.slnf --configuration Release --no-restore

      - name: Test Unit Projects
        run: |
          dotnet test --project tests/Basket.UnitTests/Basket.UnitTests.csproj --configuration Release --no-build --no-progress --output detailed
          dotnet test --project tests/Ordering.UnitTests/Ordering.UnitTests.csproj --configuration Release --no-build --no-progress --output detailed

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Start eShop App (AppHost)
        run: dotnet run --project src/eShop.AppHost/eShop.AppHost.csproj --configuration Release &
        timeout-minutes: 5

      - name: Wait for App to be Ready
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:5045/health > /dev/null 2>&1; then
              echo "App is ready!"
              exit 0
            fi
            echo "Waiting for app... (attempt $i/30)"
            sleep 2
          done
          echo "App failed to start"
          exit 1

      - name: Run E2E Tests with Playwright
        run: npx playwright test

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30