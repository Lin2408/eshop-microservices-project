name: .NET CI

'on':
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore Web Solution
        run: dotnet restore eShop.Web.slnf

      - name: Build Web Solution
        run: dotnet build eShop.Web.slnf --configuration Release --no-restore

      - name: Test Unit Projects
        run: |
          dotnet test --project tests/Basket.UnitTests/Basket.UnitTests.csproj --configuration Release --no-build --no-progress --output detailed
          dotnet test --project tests/Ordering.UnitTests/Ordering.UnitTests.csproj --configuration Release --no-build --no-progress --output detailed

      - name: Test Functional Projects
        run: |
          dotnet test --project tests/Catalog.FunctionalTests/Catalog.FunctionalTests.csproj --configuration Release --no-build --no-progress --output detailed
          dotnet test --project tests/Ordering.FunctionalTests/Ordering.FunctionalTests.csproj --configuration Release --no-build --no-progress --output detailed

  load-test-smoke:
    name: Load Test Smoke (k6)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.LOAD_TEST_BASE_URL != ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run k6 smoke test
        working-directory: load-tests
        run: |
          k6 run catalog-ci-smoke.js \
            -e BASE_URL=${{ secrets.LOAD_TEST_BASE_URL }} \
            --summary-export=summary.json

      - name: Upload k6 summary artifact
        uses: actions/upload-artifact@v4
        with:
          name: k6-smoke-summary
          path: load-tests/summary.json

